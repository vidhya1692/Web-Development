<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Universal CodeBox - Login</title>
  </head>

  <body bgcolor="lightblue">
    <h1 align="center">
      <ins><i>UNIVERSAL CODEBOX</i></ins>
    </h1>

    <hr />

    <h2 align="center">LOGIN</h2>

    <p align="center">
      <b>Welcome to Universal CodeBox!</b><br />
      Please enter your login details to continue.
    </p>

    <table
      border="2"
      cellpadding="10"
      cellspacing="5"
      align="center"
      bgcolor="white"
    >
      <tr bgcolor="darkblue">
        <th colspan="2">
          <font color="white" size="5"> Login Details </font>
        </th>
      </tr>

      <tr>
        <td><b>Login ID</b></td>
        <td>eg. 2313740</td>
      </tr>

      <tr>
        <td><b>Password</b></td>
        <td>eg. @abc</td>
      </tr>

      <tr>
        <td colspan="2" align="center">
          <input type="submit" value="LOGIN" />
          <input type="reset" value="CLEAR" />
        </td>
      </tr>
    </table>

    <br />

    <p align="center">
      <i>New user?</i>
      <a href="#">Create an Account</a>
    </p>

    <hr />

    <p align="center">
      <b>© 2026 Universal CodeBox</b>
    </p>
  </body>
</html>
